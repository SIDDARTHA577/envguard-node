name: Bug Report
description: Create a report to help us improve EnvGuard
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do **NOT** post actual production secrets, real API keys, or private `.env` files in this issue. Use dummy placeholders (e.g., `placeholder_key_123`).
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide minimal schema and environment code to reproduce the issue.
      placeholder: |
        1. Define schema:
        2. Run validation with:
        3. Observed behavior:
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      options:
        - "Node.js 24.x"
        - "Node.js 22.x (Active LTS)"
        - "Node.js 20.x (Maintenance LTS)"
        - "Other / EOL version (Node.js 18 or older)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux"
        - "macOS"
        - "Windows"
    validations:
      required: true

