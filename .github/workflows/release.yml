name: Release Verification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    name: Package Release Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite & build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Inspect npm package contents (dry-run)
        run: npm pack --dry-run
